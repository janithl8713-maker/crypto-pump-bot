name: Run Crypto Bot 24-7

on:
  schedule:
    - cron: '*/5 * * * *'  # প্রতি විනාඩි 5 කට වරක් ස්වයංක්‍රීයව ක්‍රියාත්මක වේ
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m elm install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot
        run: python bot.py
